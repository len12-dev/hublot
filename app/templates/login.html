<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title>
<style>
  :root { --bg:#f5f5f7; --fg:#1d1d1f; --accent:#0a84ff; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --card:#2c2c2e; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; }
  form { background:var(--card); padding:24px; border-radius:12px; width:min(90vw,320px); }
  input { width:100%; box-sizing:border-box; padding:10px; font-size:18px; margin:12px 0; }
  button { width:100%; padding:10px; background:var(--accent); color:#fff; border:0; border-radius:8px; font-size:16px; }
  .error { color:#ff453a; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Code PIN</h1>
  <input type="password" name="pin" inputmode="numeric" autofocus required>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Entrer</button>
</form>
</body>
</html>
